[project]
name = "autopr"
version = "0.1.0"
description = "AutoPR — Context-Aware Work Item to Pull Request Agent"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "google-adk>=2.0",
    "google-genai",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "websockets>=12.0",
    "chromadb>=0.5",
    "httpx>=0.27",
    "pygithub>=2.3",
    "python-dotenv>=1.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.9",
]
ollama = [
    "ollama>=0.3",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["autopr"]

[tool.pytest.ini_options]
testpaths = ["autopr/tests"]
asyncio_mode = "auto"
